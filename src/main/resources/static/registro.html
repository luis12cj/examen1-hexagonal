<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPN UPIIZ - Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ipn-guinda: #6c1d45;
            --ipn-guinda-dark: #4d1431;
            --ipn-dorado: #b38e2e;
            --ipn-dorado-light: #d4af37;
        }

        body {
            background: linear-gradient(135deg, #f5f0f3 0%, #eae3e7 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .header-ipn {
            background-color: var(--ipn-guinda);
            border-bottom: 4px solid var(--ipn-dorado);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .card-registro {
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(108, 29, 69, 0.12);
            border: 1px solid rgba(108, 29, 69, 0.1);
            background-color: #ffffff;
        }

        .text-guinda {
            color: var(--ipn-guinda) !important;
        }

        .btn-ipn {
            background-color: var(--ipn-guinda);
            border-color: var(--ipn-guinda);
            color: #ffffff;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-ipn:hover {
            background-color: var(--ipn-guinda-dark);
            border-color: var(--ipn-guinda-dark);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .form-control:focus {
            border-color: var(--ipn-guinda);
            box-shadow: 0 0 0 0.25rem rgba(108, 29, 69, 0.2);
        }

        .badge-ipn {
            background-color: var(--ipn-guinda);
            color: var(--ipn-dorado-light);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<!-- Barra Institucional -->
<header class="header-ipn py-3 mb-4">
    <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <!-- Logo IPN -->
            <img src="/img/ipn.png" alt="Logo IPN" style="height: 50px;" class="bg-white p-1 rounded-circle shadow-sm">

            <!-- Logo UPIIZ -->
            <img src="/img/upiiz.png" alt="Logo UPIIZ" style="height: 50px;" class="bg-white p-1 rounded shadow-sm">

            <div>
                <h5 class="text-white mb-0 fw-bold">INSTITUTO POLITÉCNICO NACIONAL</h5>
                <small class="text-warning fw-semibold">UPIIZ - Red Social Politécnica</small>
            </div>
        </div>
        <a href="/busqueda.html" class="btn btn-outline-light btn-sm fw-bold px-3">Ir al Buscador &rarr;</a>
    </div>
</header>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-registro p-4">
                <div class="text-center mb-3">
                    <span class="badge badge-ipn px-3 py-1 rounded-pill text-uppercase mb-2">Módulo de Afiliación</span>
                    <h3 class="fw-bold text-guinda mb-1">Registro de Usuario</h3>
                    <p class="text-muted small">Ingresa tus datos institucionales para darte de alta en la plataforma</p>
                </div>

                <div id="alertContainer"></div>

                <form id="registroForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Nombre(s)</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold text-secondary">Apellido Paterno</label>
                            <input type="text" class="form-control" id="apellidoPaterno" placeholder="Ej. Pérez" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold text-secondary">Apellido Materno</label>
                            <input type="text" class="form-control" id="apellidoMaterno" placeholder="Ej. López" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" placeholder="ejemplo@alumno.ipn.mx" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Nombre de Usuario (Mínimo 5 letras)</label>
                        <input type="text" class="form-control" id="usuario" placeholder="Ej. jperezl" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Contraseña (Mínimo 8 caracteres)</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento" required>
                    </div>
                    <button type="submit" class="btn btn-ipn w-100 py-2 shadow-sm">Completar Registro</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registroForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertContainer = document.getElementById('alertContainer');
        alertContainer.innerHTML = '';

        const data = {
            nombre: document.getElementById('nombre').value.trim(),
            apellidoPaterno: document.getElementById('apellidoPaterno').value.trim(),
            apellidoMaterno: document.getElementById('apellidoMaterno').value.trim(),
            correo: document.getElementById('correo').value.trim(),
            usuario: document.getElementById('usuario').value.trim(),
            password: document.getElementById('password').value,
            fechaNacimiento: document.getElementById('fechaNacimiento').value
        };

        try {
            const response = await fetch('/api/v1/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                alertContainer.innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <strong>¡Éxito!</strong> Usuario registrado correctamente.
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>`;
                document.getElementById('registroForm').reset();
            } else {
                alertContainer.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            ${result.mensaje || 'Error al procesar la solicitud.'}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>`;
            }
        } catch (err) {
            alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        Error de comunicación con el servidor.
                    </div>`;
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
