<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPN UPIIZ - Directorio de Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ipn-guinda: #6c1d45;
            --ipn-guinda-dark: #4d1431;
            --ipn-dorado: #b38e2e;
            --ipn-dorado-light: #d4af37;
        }

        body {
            background: linear-gradient(135deg, #f5f0f3 0%, #eae3e7 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .header-ipn {
            background-color: var(--ipn-guinda);
            border-bottom: 4px solid var(--ipn-dorado);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .card-busqueda {
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(108, 29, 69, 0.12);
            border: 1px solid rgba(108, 29, 69, 0.1);
            background-color: #ffffff;
        }

        .text-guinda {
            color: var(--ipn-guinda) !important;
        }

        .btn-ipn {
            background-color: var(--ipn-guinda);
            border-color: var(--ipn-guinda);
            color: #ffffff;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-ipn:hover {
            background-color: var(--ipn-guinda-dark);
            border-color: var(--ipn-guinda-dark);
            color: #ffffff;
        }

        .form-control:focus {
            border-color: var(--ipn-guinda);
            box-shadow: 0 0 0 0.25rem rgba(108, 29, 69, 0.2);
        }

        /* Tarjeta de usuario con la identidad de la red social */
        .user-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 6px solid var(--ipn-guinda);
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .user-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(108, 29, 69, 0.15);
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #f3e9ef;
            color: var(--ipn-guinda);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px solid var(--ipn-dorado);
        }

        .user-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #212529;
            margin-bottom: 2px;
        }

        .user-handle {
            color: var(--ipn-guinda);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .badge-ipn {
            background-color: var(--ipn-guinda);
            color: var(--ipn-dorado-light);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<!-- Barra Institucional -->
<header class="header-ipn py-3 mb-4">
    <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <!-- Logo IPN -->
            <img src="/img/ipn.png" alt="Logo IPN" style="height: 50px;" class="bg-white p-1 rounded-circle shadow-sm">

            <!-- Logo UPIIZ -->
            <img src="/img/upiiz.png" alt="Logo UPIIZ" style="height: 50px;" class="bg-white p-1 rounded shadow-sm">

            <div>
                <h5 class="text-white mb-0 fw-bold">INSTITUTO POLITÉCNICO NACIONAL</h5>
                <small class="text-warning fw-semibold">UPIIZ - Red Social Politécnica</small>
            </div>
        </div>
        <a href="/registro.html" class="btn btn-outline-light btn-sm fw-bold px-3">&larr; Nuevo Registro</a>
    </div>
</header>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card card-busqueda p-4">
                <div class="text-center mb-3">
                    <span class="badge badge-ipn px-3 py-1 rounded-pill text-uppercase mb-2">Buscador Politécnico</span>
                    <h3 class="fw-bold text-guinda mb-1">BUSCAR PERSONAS</h3>
                    <p class="text-muted small">Encuentra usuarios por nombre, apellido paterno, materno o @usuario</p>
                </div>

                <div class="input-group mb-3 shadow-sm">
                    <input type="text" id="busquedaInput" class="form-control py-2" placeholder="Escribe al menos 3 caracteres (ej. juan)..." autocomplete="off">
                    <button id="btnBuscar" class="btn btn-ipn px-4">BUSCAR</button>
                </div>

                <div id="alertContainer"></div>

                <div class="mt-3">
                    <h6 class="text-guinda fw-bold mb-3" id="tituloResultados" style="display: none;">Resultados encontrados:</h6>
                    <div id="resultadosContainer"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const btnBuscar = document.getElementById('btnBuscar');
    const inputTexto = document.getElementById('busquedaInput');
    const alertContainer = document.getElementById('alertContainer');
    const resultadosContainer = document.getElementById('resultadosContainer');
    const tituloResultados = document.getElementById('tituloResultados');

    async function ejecutarBusqueda() {
        const query = inputTexto.value.trim();
        alertContainer.innerHTML = '';
        resultadosContainer.innerHTML = '';
        tituloResultados.style.display = 'none';

        // Restricción en frontend: no buscar con menos de 3 caracteres
        if (query.length < 3) {
            alertContainer.innerHTML = `
                    <div class="alert alert-warning py-2 text-center" role="alert">
                        <strong>Atención:</strong> La búsqueda debe contener al menos 3 caracteres.
                    </div>`;
            return;
        }

        try {
            const response = await fetch(`/api/v1/usuarios/buscar?texto=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (!response.ok) {
                alertContainer.innerHTML = `
                        <div class="alert alert-danger py-2 text-center" role="alert">
                            ${data.mensaje || 'Error en la búsqueda.'}
                        </div>`;
                return;
            }

            tituloResultados.style.display = 'block';

            if (data.length === 0) {
                resultadosContainer.innerHTML = `
                        <div class="text-center py-4 text-muted">
                            No se encontraron miembros registrados con "<strong>${query}</strong>".
                        </div>`;
                return;
            }

            // Generar tarjetas con avatar de iniciales
            data.forEach(user => {
                const inicial = user.nombre ? user.nombre.charAt(0).toUpperCase() : 'U';
                const item = document.createElement('div');
                item.className = 'user-item';
                item.innerHTML = `
                        <div class="user-avatar">${inicial}</div>
                        <div>
                            <div class="user-name">${user.nombre} ${user.apellidoPaterno} ${user.apellidoMaterno}</div>
                            <div class="user-handle">@${user.usuario}</div>
                        </div>
                    `;
                resultadosContainer.appendChild(item);
            });

        } catch (err) {
            alertContainer.innerHTML = `
                    <div class="alert alert-danger py-2 text-center" role="alert">
                        No fue posible contactar al servidor.
                    </div>`;
        }
    }

    btnBuscar.addEventListener('click', ejecutarBusqueda);
    inputTexto.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') ejecutarBusqueda();
    });
</script>
</body>
</html>
